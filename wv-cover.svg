<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Animated preview of the West Valley Music FAQ social media post: question cards pop in one by one with a map pin bouncing and piano keys playing" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="bg" cx="50%" cy="40%" r="85%"><stop offset="0" stop-color="#34483a"/><stop offset="1" stop-color="#212e26"/></radialGradient></defs>
<style>
  text{font-family:Georgia,'Times New Roman',serif}
  *{animation-duration:12.0s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.9,.25,1.15)}
  .card{opacity:0;transform-box:fill-box;transform-origin:center}
  .c0{animation-name:c0}
  @keyframes c0{0%,4.17%{opacity:0;transform:scale(.82) translateY(14px)}8.75%{opacity:1;transform:scale(1) translateY(0)}90.00%{opacity:1;transform:scale(1)}95.83%,100%{opacity:0;transform:scale(.97)}}
  .c1{animation-name:c1}
  @keyframes c1{0%,8.75%{opacity:0;transform:scale(.82) translateY(14px)}13.33%{opacity:1;transform:scale(1) translateY(0)}90.00%{opacity:1;transform:scale(1)}95.83%,100%{opacity:0;transform:scale(.97)}}
  .c2{animation-name:c2}
  @keyframes c2{0%,13.33%{opacity:0;transform:scale(.82) translateY(14px)}17.92%{opacity:1;transform:scale(1) translateY(0)}90.00%{opacity:1;transform:scale(1)}95.83%,100%{opacity:0;transform:scale(.97)}}
  .c3{animation-name:c3}
  @keyframes c3{0%,6.67%{opacity:0;transform:scale(.82) translateY(14px)}11.25%{opacity:1;transform:scale(1) translateY(0)}90.00%{opacity:1;transform:scale(1)}95.83%,100%{opacity:0;transform:scale(.97)}}
  .c4{animation-name:c4}
  @keyframes c4{0%,11.25%{opacity:0;transform:scale(.82) translateY(14px)}15.83%{opacity:1;transform:scale(1) translateY(0)}90.00%{opacity:1;transform:scale(1)}95.83%,100%{opacity:0;transform:scale(.97)}}
  .c5{animation-name:c5}
  @keyframes c5{0%,15.83%{opacity:0;transform:scale(.82) translateY(14px)}20.42%{opacity:1;transform:scale(1) translateY(0)}90.00%{opacity:1;transform:scale(1)}95.83%,100%{opacity:0;transform:scale(.97)}}

  .head{animation-name:head;opacity:0}
  @keyframes head{0%{opacity:0;transform:translateY(-10px)}3.75%{opacity:1;transform:translateY(0)}90.00%{opacity:1}95.83%,100%{opacity:0}}
  .foot{animation-name:foot;opacity:0}
  @keyframes foot{0%,19.17%{opacity:0;transform:translateY(10px)}24.17%{opacity:1;transform:translateY(0)}90.00%{opacity:1}95.83%,100%{opacity:0}}
  .pin{animation:bounce 1.2s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .key{animation:keyp 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
  @keyframes keyp{0%,12%,100%{fill:#f4efe2;transform:scaleY(1)}4%,8%{fill:#e8c46a;transform:scaleY(.94)}}
  .note{opacity:0;animation:rise 2.8s ease-out infinite}
  @keyframes rise{0%{opacity:0;transform:translate(0,6px)}15%{opacity:1}100%{opacity:0;transform:translate(10px,-16px)}}
  .glow{animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{0%,100%{fill:#e8c46a}50%{fill:#fff3c8}}
  .shine{animation:shine 3.2s ease-in-out infinite}
  @keyframes shine{0%,100%{fill-opacity:.0}50%{fill-opacity:.12}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.card,.head,.foot{opacity:1}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<g class="head">
  <text x="40" y="58" fill="#d8b055" font-size="24" font-style="italic" letter-spacing="1">West Valley Music</text>
  <rect x="330" y="28" width="430" height="50" rx="10" fill="#9b6a0d"/>
  <text x="545" y="61" text-anchor="middle" fill="#f8f1df" font-size="22" font-weight="600">Frequently Asked Questions</text>
  <rect x="40" y="92" width="720" height="3" fill="#9b6a0d"/>
</g>
<g class="card c0"><rect x="40" y="112" width="350" height="138" rx="22" fill="#4f6451"/><g transform="translate(48 118)"><circle cx="0" cy="0" r="17" fill="#a06f12"/><text y="7" text-anchor="middle" fill="#f6efe0" font-size="20">1</text></g><text x="76" y="142" fill="#f3eddf" font-size="15" font-weight="600">Where is the store?</text><text x="62" y="166" fill="#e9e2d0" font-size="12.5">300 W El Camino Real, Mountain</text><text x="62" y="183" fill="#e9e2d0" font-size="12.5">View, CA. Next to Jack in the Box.</text><g transform="translate(258 182)"><rect width="104" height="58" fill="#e8e3d4" stroke="#a06f12" stroke-width="3"/>
          <path d="M-0 38L104 12" stroke="#8aa3b8" stroke-width="7"/><path d="M20 0L40 58M70 0L88 58M0 22H104" stroke="#cfc8b4" stroke-width="2"/>
          <g class="pin"><path d="M52 8a8 8 0 0 1 8 8c0 7-8 15-8 15s-8-8-8-15a8 8 0 0 1 8-8z" fill="#d9382c"/><circle cx="52" cy="16" r="3" fill="#fff"/></g></g>
          <text x="166" y="232" fill="#e9e2d0" font-size="14" font-style="italic">check maps!</text>
          <path d="M240 222q-24 6-34 -2" stroke="#f3eddf" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M208 218l8 -6M208 218l9 5" stroke="#f3eddf" stroke-width="2" stroke-linecap="round"/></g>
<g class="card c1"><rect x="40" y="266" width="350" height="84" rx="22" fill="#4f6451"/><g transform="translate(48 272)"><circle cx="0" cy="0" r="17" fill="#a06f12"/><text y="7" text-anchor="middle" fill="#f6efe0" font-size="20">2</text></g><text x="76" y="296" fill="#f3eddf" font-size="15" font-weight="600">Do you offer music lessons?</text><text x="62" y="320" fill="#e9e2d0" font-size="12.5">Yes, for select instruments. Teachers</text><text x="62" y="337" fill="#e9e2d0" font-size="12.5">manage their own schedules.</text></g>
<g class="card c2"><rect x="40" y="366" width="350" height="66" rx="22" fill="#4f6451"/><g transform="translate(48 372)"><circle cx="0" cy="0" r="17" fill="#a06f12"/><text y="7" text-anchor="middle" fill="#f6efe0" font-size="20">3</text></g><text x="76" y="396" fill="#f3eddf" font-size="15" font-weight="600">What are your hours?</text><text x="62" y="420" fill="#e9e2d0" font-size="12.5">Mon–Sat, 10 am – 7 pm. Closed Sundays.</text></g>
<g class="card c3"><rect x="410" y="112" width="350" height="80" rx="22" fill="#4f6451"/><g transform="translate(418 118)"><circle cx="0" cy="0" r="17" fill="#a06f12"/><text y="7" text-anchor="middle" fill="#f6efe0" font-size="20">4</text></g><text x="446" y="142" fill="#f3eddf" font-size="14" font-weight="600">How can I check if an item is in stock?</text><text x="432" y="166" fill="#e9e2d0" font-size="12.5">Give us a call! We'll check the shelves.</text></g>
<g class="card c4"><rect x="410" y="206" width="350" height="116" rx="22" fill="#4f6451"/><g transform="translate(418 212)"><circle cx="0" cy="0" r="17" fill="#a06f12"/><text y="7" text-anchor="middle" fill="#f6efe0" font-size="20">5</text></g><text x="446" y="236" fill="#f3eddf" font-size="15" font-weight="600">Do you have practice rooms?</text><text x="432" y="260" fill="#e9e2d0" font-size="12.5">Yes! Rent for personal use at $12 an hour.</text><g transform="translate(432 284)"><rect class="key" style="animation-delay:0.0s" x="0" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:0.2s" x="24" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:0.4s" x="48" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:0.6s" x="72" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:0.8s" x="96" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:1.0s" x="120" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:1.2s" x="144" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:1.4s" x="168" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:1.6s" x="192" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:1.8s" x="216" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:2.0s" x="240" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect class="key" style="animation-delay:2.2s" x="264" y="0" width="22" height="28" rx="2" fill="#f4efe2"/><rect x="16" y="0" width="14" height="17" rx="2" fill="#1b1f1b"/><rect x="40" y="0" width="14" height="17" rx="2" fill="#1b1f1b"/><rect x="88" y="0" width="14" height="17" rx="2" fill="#1b1f1b"/><rect x="112" y="0" width="14" height="17" rx="2" fill="#1b1f1b"/><rect x="136" y="0" width="14" height="17" rx="2" fill="#1b1f1b"/><rect x="184" y="0" width="14" height="17" rx="2" fill="#1b1f1b"/><rect x="208" y="0" width="14" height="17" rx="2" fill="#1b1f1b"/><rect x="256" y="0" width="14" height="17" rx="2" fill="#1b1f1b"/><g class="note" style="animation-delay:0s" transform="translate(60 -8)"><ellipse cx="0" cy="0" rx="5" ry="3.6" fill="#e8c46a" transform="rotate(-20)"/><path d="M4.5 -1V-16" stroke="#e8c46a" stroke-width="2"/></g><g class="note" style="animation-delay:0.9s" transform="translate(170 -8)"><ellipse cx="0" cy="0" rx="5" ry="3.6" fill="#e8c46a" transform="rotate(-20)"/><path d="M4.5 -1V-16" stroke="#e8c46a" stroke-width="2"/></g><g class="note" style="animation-delay:1.8s" transform="translate(260 -8)"><ellipse cx="0" cy="0" rx="5" ry="3.6" fill="#e8c46a" transform="rotate(-20)"/><path d="M4.5 -1V-16" stroke="#e8c46a" stroke-width="2"/></g></g><text x="708" y="236" fill="#e8c46a" font-size="22" font-weight="700" class="glow">$12</text></g>
<g class="card c5"><rect x="410" y="336" width="350" height="96" rx="22" fill="#4f6451"/><g transform="translate(418 342)"><circle cx="0" cy="0" r="17" fill="#a06f12"/><text y="7" text-anchor="middle" fill="#f6efe0" font-size="20">6</text></g><text x="446" y="366" fill="#f3eddf" font-size="15" font-weight="600">How do instrument rentals work?</text><text x="432" y="390" fill="#e9e2d0" font-size="12.5">Monthly, with a 3-month minimum.</text><text x="432" y="407" fill="#e9e2d0" font-size="12.5">Deposit returned in good shape.</text></g>

<g class="foot"><rect x="60" y="446" width="680" height="36" rx="8" fill="#4f6451"/><text x="400" y="470" text-anchor="middle" fill="#f3eddf" font-size="14.5">For further questions, never hesitate to call (650) 961-1566</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>