<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Animated Mr. Bulgogi food truck decision analysis: the pop-up truck parks, 20-year NPV bars grow for three alternatives with going permanent far ahead at $12.11M, then the truck drives off and a permanent restaurant opens in its place" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#2a221b"/><stop offset="1" stop-color="#0d0b09"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ede7dc" stroke-opacity="0.045"/></pattern>
  <pattern id="stripe" width="24" height="26" patternUnits="userSpaceOnUse"><rect width="12" height="26" fill="#C6461D"/><rect x="12" width="12" height="26" fill="#f1e8d8"/></pattern>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4502a"/><stop offset="1" stop-color="#a93a18"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dfa8"/><stop offset="1" stop-color="#e3b66a"/></linearGradient>
</defs>
<style>
  text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  *{animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  .truck{animation-name:truck} .wheel{transform-box:fill-box;transform-origin:center;animation-name:wheel}
  @keyframes truck{0%{transform:translateX(-560px);animation-timing-function:cubic-bezier(.15,.75,.25,1)}13%{transform:translateX(0)}58%{transform:translateX(0);animation-timing-function:cubic-bezier(.6,0,.9,.45)}71%{transform:translateX(620px)}100%{transform:translateX(620px)}}
  @keyframes wheel{0%{transform:rotate(0)}13%{transform:rotate(520deg)}58%{transform:rotate(520deg)}71%{transform:rotate(1100deg)}100%{transform:rotate(1100deg)}}
  .steam{opacity:0;animation-name:steamshow}
  @keyframes steamshow{0%,13%{opacity:0}16%,56%{opacity:1}58%,100%{opacity:0}}
  .puff{animation-name:puff;animation-duration:2.2s;transform-box:fill-box;transform-origin:center}
  .puff.b{animation-delay:-.7s}.puff.c{animation-delay:-1.4s}
  @keyframes puff{0%{transform:translateY(8px) scale(.6);opacity:0}30%{opacity:.7}100%{transform:translateY(-26px) scale(1.5);opacity:0}}
  .bld{opacity:0;transform-origin:400px 250px;animation-name:bld}
  @keyframes bld{0%,64%{transform:scaleY(0);opacity:0}67%{opacity:1}76%{transform:scaleY(1.05)}80%{transform:scaleY(1)}94%{opacity:1;transform:scaleY(1)}98%,100%{opacity:0;transform:scaleY(1)}}
  .open{animation-name:neon;animation-duration:1.4s}
  @keyframes neon{0%,100%{opacity:1}50%{opacity:.45}}
  .chip-a{animation-name:chipa} .chip-b{opacity:0;animation-name:chipb}
  @keyframes chipa{0%{opacity:1}64%{opacity:1}67%,100%{opacity:0}}
  @keyframes chipb{0%,70%{opacity:0}73%,94%{opacity:1}97%,100%{opacity:0}}
  .bars{animation-name:barsfade}
  @keyframes barsfade{0%{opacity:1}95%{opacity:1}98%,100%{opacity:0}}
  .bar{transform-box:fill-box;transform-origin:left center}
  .b1{animation-name:g1}.b2{animation-name:g2}.b3{animation-name:g3}
  @keyframes g1{0%,15%{transform:scaleX(0)}21%,100%{transform:scaleX(1)}}
  @keyframes g2{0%,21%{transform:scaleX(0)}27%,100%{transform:scaleX(1)}}
  @keyframes g3{0%,44%{transform:scaleX(0);animation-timing-function:cubic-bezier(.2,.8,.2,1)}60%,100%{transform:scaleX(1)}}
  .v1{opacity:0;animation-name:v1}.v2{opacity:0;animation-name:v2}.v3{opacity:0;animation-name:v3}.rec{opacity:0;transform-box:fill-box;transform-origin:left center;animation-name:rec}
  @keyframes v1{0%,20%{opacity:0}24%,100%{opacity:1}}
  @keyframes v2{0%,26%{opacity:0}30%,100%{opacity:1}}
  @keyframes v3{0%,56%{opacity:0}61%,100%{opacity:1}}
  @keyframes rec{0%,58%{opacity:0;transform:scale(.7)}62%{opacity:1;transform:scale(1.08)}64%,100%{opacity:1;transform:scale(1)}}
  .survey{opacity:0;animation-name:survey}
  @keyframes survey{0%,78%{opacity:0;transform:translateY(8px)}83%,94%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.bld,.survey,.chip-b{opacity:0}.steam{opacity:0}.v1,.v2,.v3,.rec{opacity:1}}
</style>

<rect width="800" height="500" fill="url(#bg)"/><rect width="800" height="500" fill="url(#grid)"/>

<text x="40" y="52" fill="#ede7dc" fill-opacity=".9" font-size="15" letter-spacing="5">TO TRUCK OR NOT TO TRUCK?</text>
<text x="40" y="72" fill="#C6461D" font-size="10.5" letter-spacing="3.4">MR. BULGOGI · DECISION ANALYSIS</text>

<!-- state chips -->
<g text-anchor="end">
  <g class="chip-a"><rect x="640" y="36" width="120" height="26" rx="13" fill="none" stroke="#ede7dc" stroke-opacity=".5"/><text x="700" y="53" text-anchor="middle" fill="#ede7dc" font-size="10.5" letter-spacing="2.4">SEASONAL POP-UP</text></g>
  <g class="chip-b"><rect x="640" y="36" width="120" height="26" rx="13" fill="#C6461D"/><text x="700" y="53" text-anchor="middle" fill="#fff" font-size="10.5" letter-spacing="2.4">PERMANENT</text></g>
</g>

<!-- ground -->
<rect x="0" y="250" width="800" height="3" fill="#ede7dc" fill-opacity=".18"/>
<g stroke="#ede7dc" stroke-opacity=".14" stroke-width="3" stroke-dasharray="26 22"><path d="M0 266H800"/></g>

<!-- restaurant (appears after truck leaves) -->
<g class="bld">
  <rect x="255" y="112" width="290" height="138" rx="4" fill="#2b231c" stroke="#ede7dc" stroke-opacity=".18"/>
  <rect x="249" y="112" width="302" height="28" fill="url(#stripe)"/>
  <rect x="249" y="136" width="302" height="5" fill="#000" fill-opacity=".25"/>
  <rect x="318" y="76" width="164" height="28" rx="4" fill="#C6461D"/><text x="400" y="95" text-anchor="middle" fill="#fff" font-size="13" letter-spacing="3">MR. BULGOGI</text>
  <rect x="278" y="158" width="120" height="76" rx="3" fill="url(#glow)"/>
  <path d="M338 158v76M278 196h120" stroke="#8c6a3a" stroke-opacity=".6" stroke-width="2"/>
  <rect x="425" y="158" width="92" height="92" rx="3" fill="#3a2e24"/><circle cx="505" cy="205" r="3" fill="#e3b66a"/>
  <g class="open"><rect x="437" y="170" width="68" height="24" rx="4" fill="none" stroke="#f7dfa8" stroke-width="2"/><text x="471" y="187" text-anchor="middle" fill="#f7dfa8" font-size="13" letter-spacing="3">OPEN</text></g>
</g>

<!-- truck -->
<g class="truck">
  <g class="steam">
    <circle class="puff" cx="330" cy="150" r="7" fill="#ede7dc" fill-opacity=".5"/>
    <circle class="puff b" cx="352" cy="150" r="6" fill="#ede7dc" fill-opacity=".5"/>
    <circle class="puff c" cx="374" cy="150" r="7" fill="#ede7dc" fill-opacity=".5"/>
  </g>
  <rect x="250" y="146" width="236" height="100" rx="10" fill="url(#body)"/>
  <path d="M486 176h38q14 0 20 12l8 22q3 8 3 16v20H486z" fill="url(#body)"/>
  <path d="M500 184h22q8 0 12 8l6 14h-40z" fill="#cfe3ea" fill-opacity=".85"/>
  <rect x="266" y="168" width="150" height="52" rx="4" fill="#2a1c14"/>
  <rect x="266" y="168" width="150" height="52" rx="4" fill="url(#glow)" fill-opacity=".35"/>
  <rect x="258" y="154" width="166" height="18" fill="url(#stripe)"/>
  <rect x="258" y="170" width="166" height="4" fill="#000" fill-opacity=".25"/>
  <text x="333" y="238" text-anchor="middle" fill="#fff" font-size="12" letter-spacing="3">MR. BULGOGI</text>
  <rect x="250" y="236" width="296" height="10" fill="#7e2b10"/>
  <g><circle class="wheel" cx="310" cy="248" r="21" fill="#17120e"/><circle class="wheel" cx="310" cy="248" r="10" fill="#c9c3b6"/><rect class="wheel" x="308" y="238" width="4" height="20" fill="#17120e"/>
     <circle class="wheel" cx="505" cy="248" r="21" fill="#17120e"/><circle class="wheel" cx="505" cy="248" r="10" fill="#c9c3b6"/><rect class="wheel" x="503" y="238" width="4" height="20" fill="#17120e"/></g>
</g>

<!-- survey stat -->
<g class="survey">
  <rect x="580" y="118" width="3" height="78" fill="#C6461D"/>
  <text x="594" y="150" fill="#ede7dc" font-size="34">61%</text>
  <text x="594" y="170" fill="#ede7dc" fill-opacity=".7" font-size="10.5">say a full-time location</text>
  <text x="594" y="184" fill="#ede7dc" fill-opacity=".7" font-size="10.5">would improve satisfaction</text>
</g>

<!-- NPV bars -->
<g class="bars">
  <text x="40" y="306" fill="#ede7dc" fill-opacity=".85" font-size="11" letter-spacing="3">20-YEAR NPV BY ALTERNATIVE</text>
  <text x="760" y="306" text-anchor="end" fill="#ede7dc" fill-opacity=".45" font-size="10" letter-spacing="1.2">discounted at CMU WACC 7.01%</text>

  <text x="40" y="338" fill="#ede7dc" fill-opacity=".75" font-size="11.5">Maintain status quo</text>
  <rect x="40" y="345" width="600" height="9" rx="4.5" fill="#ede7dc" fill-opacity=".08"/>
  <rect class="bar b1" x="40" y="345" width="63" height="9" rx="4.5" fill="#ede7dc" fill-opacity=".55"/>
  <text class="v1" x="760" y="354" text-anchor="end" fill="#ede7dc" fill-opacity=".8" font-size="12">$1.28M</text>

  <text x="40" y="378" fill="#ede7dc" fill-opacity=".75" font-size="11.5">Continue pop-up + new restaurant</text>
  <rect x="40" y="385" width="600" height="9" rx="4.5" fill="#ede7dc" fill-opacity=".08"/>
  <rect class="bar b2" x="40" y="385" width="58" height="9" rx="4.5" fill="#ede7dc" fill-opacity=".55"/>
  <text class="v2" x="760" y="394" text-anchor="end" fill="#ede7dc" fill-opacity=".8" font-size="12">$1.18M</text>

  <text x="40" y="418" fill="#ede7dc" font-size="11.5">Mr. Bulgogi permanent location</text>
  <g class="rec"><rect x="214" y="406" width="86" height="16" rx="3" fill="#C6461D"/><text x="257" y="418" text-anchor="middle" fill="#fff" font-size="9" letter-spacing="1.6">RECOMMENDED</text></g>
  <rect x="40" y="425" width="600" height="11" rx="5.5" fill="#ede7dc" fill-opacity=".08"/>
  <rect class="bar b3" x="40" y="425" width="600" height="11" rx="5.5" fill="#E0562A"/>
  <text class="v3" x="760" y="435" text-anchor="end" fill="#E0562A" font-size="14" font-weight="600">$12.11M</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
