    Cassandra May

<div class="page-hero photo-hero">
  <a class="back-link" href="/">&larr; Back to Work</a>
  <div class="movement"><h1>Photography</h1></div>
  <p class="section-intro">People, places, and passing moments</p>
</div>

<section class="photo-viewer-section">
  <div class="camframe">
    <div class="camframe-topbar">
      <span class="camframe-lens" aria-hidden="true"></span>
      <span class="camframe-swatch" aria-hidden="true"></span>
      <span class="camframe-brand">CASS&nbsp;&middot;&nbsp;CAM</span>
    </div>

    <div class="camframe-viewport" id="pvViewport">
      <img id="pvImg" src="/travel-chiangmai.jpeg" alt="Chiang Mai, Thailand">
      <div class="camframe-caption">
        <span id="pvLoc">Chiang Mai, Thailand</span>
        <span id="pvCount" class="camframe-count">01 / 12</span>
      </div>
    </div>

    <div class="camframe-controls">
      <button class="camframe-arrow" id="pvPrev" aria-label="Previous photo">&lsaquo;</button>
      <button class="camframe-arrow" id="pvNext" aria-label="Next photo">&rsaquo;</button>
    </div>
  </div>

  <div class="photo-roll" id="pvRoll">
    <button class="photo-roll-item active" data-index="0" aria-label="View Chiang Mai, Thailand"><img src="/travel-chiangmai.jpeg" alt="Chiang Mai, Thailand" loading="lazy"></button>
    <button class="photo-roll-item" data-index="1" aria-label="View Hallstatt, Austria"><img src="/travel-hallstatt.jpeg" alt="Hallstatt, Austria" loading="lazy"></button>
    <button class="photo-roll-item" data-index="2" aria-label="View Pacific Coast Highway, CA"><img src="/travel-pch.jpg" alt="Pacific Coast Highway, CA" loading="lazy"></button>
    <button class="photo-roll-item" data-index="3" aria-label="View Joshua Tree, CA"><img src="/travel-joshuatree.jpeg" alt="Joshua Tree, CA" loading="lazy"></button>
    <button class="photo-roll-item" data-index="4" aria-label="View Lake Bled, Slovenia"><img src="/travel-lakebled.jpeg" alt="Lake Bled, Slovenia" loading="lazy"></button>
    <button class="photo-roll-item" data-index="5" aria-label="View Monaco"><img src="/travel-monaco.jpeg" alt="Monaco" loading="lazy"></button>
    <button class="photo-roll-item" data-index="6" aria-label="View Pittsburgh, PA"><img src="/travel-pittsburgh.jpeg" alt="Pittsburgh, PA" loading="lazy"></button>
    <button class="photo-roll-item" data-index="7" aria-label="View San Diego, CA"><img src="/travel-sandiego.jpeg" alt="San Diego, CA" loading="lazy"></button>
    <button class="photo-roll-item" data-index="8" aria-label="View Santorini, Greece"><img src="/travel-santorini.jpeg" alt="Santorini, Greece" loading="lazy"></button>
    <button class="photo-roll-item" data-index="9" aria-label="View Seoul, S. Korea"><img src="/travel-seoul.jpg" alt="Seoul, S. Korea" loading="lazy"></button>
    <button class="photo-roll-item" data-index="10" aria-label="View Yangshuo, China"><img src="/travel-yangshuo.jpeg" alt="Yangshuo, China" loading="lazy"></button>
    <button class="photo-roll-item" data-index="11" aria-label="View Yosemite, CA"><img src="/travel-yosemite.jpeg" alt="Yosemite, CA" loading="lazy"></button>
  </div>
</section>

<script>
(function(){
  var photos = [["/travel-chiangmai.jpeg", "Chiang Mai, Thailand"], ["/travel-hallstatt.jpeg", "Hallstatt, Austria"], ["/travel-pch.jpg", "Pacific Coast Highway, CA"], ["/travel-joshuatree.jpeg", "Joshua Tree, CA"], ["/travel-lakebled.jpeg", "Lake Bled, Slovenia"], ["/travel-monaco.jpeg", "Monaco"], ["/travel-pittsburgh.jpeg", "Pittsburgh, PA"], ["/travel-sandiego.jpeg", "San Diego, CA"], ["/travel-santorini.jpeg", "Santorini, Greece"], ["/travel-seoul.jpg", "Seoul, S. Korea"], ["/travel-yangshuo.jpeg", "Yangshuo, China"], ["/travel-yosemite.jpeg", "Yosemite, CA"]];
  var idx = 0;
  var imgEl = document.getElementById('pvImg');
  var locEl = document.getElementById('pvLoc');
  var countEl = document.getElementById('pvCount');
  var rollEl = document.getElementById('pvRoll');
  var items = rollEl.querySelectorAll('.photo-roll-item');

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function render(){
    var p = photos[idx];
    imgEl.src = p[0];
    imgEl.alt = p[1];
    locEl.textContent = p[1];
    countEl.textContent = pad(idx + 1) + ' / ' + pad(photos.length);
    items.forEach(function(it, i){
      it.classList.toggle('active', i === idx);
    });
    var active = items[idx];
    if(active){
      active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function go(delta){
    idx = (idx + delta + photos.length) % photos.length;
    render();
  }

  document.getElementById('pvPrev').addEventListener('click', function(){ go(-1); });
  document.getElementById('pvNext').addEventListener('click', function(){ go(1); });

  items.forEach(function(it, i){
    it.addEventListener('click', function(){ idx = i; render(); });
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft'){ go(-1); }
    else if(e.key === 'ArrowRight'){ go(1); }
  });

  // Keep the photo roll pinned to the camera widget's own height so it
  // scrolls internally instead of stretching (and growing) the whole page.
  var camEl = document.querySelector('.camframe');
  function syncRollHeight(){
    if(window.matchMedia('(max-width:760px)').matches){
      rollEl.style.maxHeight = '';
    } else {
      rollEl.style.maxHeight = camEl.offsetHeight + 'px';
    }
  }
  syncRollHeight();
  window.addEventListener('resize', syncRollHeight);
})();
</script>
