<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassandra May's Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .gate{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.6rem; padding:2rem; text-align:center;
  }
  .gate-mark{ display:flex; align-items:center; gap:0.8rem; }
  .gate-mark .sunflower-mark{ width:48px; height:48px; }
  .gate-mark span.title{ font-family:'Fredoka', sans-serif; font-weight:600; font-size:1.5rem; color:var(--ink); }
  .gate-form{ display:flex; gap:0.6rem; flex-wrap:wrap; justify-content:center; }
  .gate-form input[type="password"]{
    font-family:'IBM Plex Mono', monospace; font-size:0.9rem; padding:0.85rem 1.2rem;
    border:2px solid var(--ink); border-radius:999px; background:var(--white); color:var(--ink);
    width:220px; outline:none;
  }
  .gate-form input[type="password"]:focus{ border-color:var(--blue-deep); }
  .gate-form button{
    font-family:'IBM Plex Mono', monospace; font-size:0.82rem; letter-spacing:0.03em;
    padding:0.85rem 1.5rem; border-radius:999px; border:2px solid var(--ink);
    background:var(--brown); color:var(--white); cursor:pointer; transition:all 0.2s ease;
  }
  .gate-form button:hover{ background:var(--blue-deep); border-color:var(--blue-deep); }
  .gate-error{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--blue-deep); opacity:0; height:1.2rem;
  }
  .gate-error.show{ opacity:1; }
</style>
</head>
<body>

<div class="gate">
  <div class="gate-mark">
    <span class="sunflower-mark">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g class="sunflower-petals">
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(0 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(36 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(72 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(108 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(144 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(180 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(216 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(252 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(288 60 60)"/>
          <ellipse cx="60" cy="22" rx="9" ry="20" fill="var(--blue)" stroke="var(--brown)" stroke-width="1.5" transform="rotate(324 60 60)"/>
        </g>
        <circle cx="60" cy="60" r="29" fill="var(--brown-deep)"/>
        <circle cx="49" cy="55" r="6" fill="none" stroke="var(--white)" stroke-width="3"/>
        <circle cx="49" cy="58" r="1.7" fill="var(--white)"/>
        <circle cx="71" cy="55" r="6" fill="none" stroke="var(--white)" stroke-width="3"/>
        <circle cx="71" cy="58" r="1.7" fill="var(--white)"/>
        <path d="M47,70 Q60,80 73,70" fill="none" stroke="var(--white)" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="title">Cassandra May's Portfolio</span>
  </div>

  <form class="gate-form" id="gateForm" autocomplete="off">
    <input type="password" id="gatePassword" placeholder="Password" aria-label="Password" required>
    <button type="submit">Enter</button>
  </form>
  <div class="gate-error" id="gateError">Incorrect password — try again.</div>
</div>

<script>
  // Note: this is a lightweight front-door, not real security — the password
  // is visible in this file's source. Fine for keeping casual visitors out,
  // not for protecting anything truly private.
  (function(){
    if (sessionStorage.getItem('cmpUnlocked') === 'true') {
      window.location.replace('home.html');
      return;
    }
    var form = document.getElementById('gateForm');
    var input = document.getElementById('gatePassword');
    var error = document.getElementById('gateError');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if (input.value.trim().toLowerCase() === 'sunflower') {
        sessionStorage.setItem('cmpUnlocked', 'true');
        window.location.href = 'home.html';
      } else {
        error.classList.add('show');
        input.value = '';
        input.focus();
      }
    });
  })();
</script>

</body>
</html>
