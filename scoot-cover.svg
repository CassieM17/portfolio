<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Animated ScootScoot dashboard on a cardboard handlebar prototype: hands unlock the scooter, then fold mode is confirmed and initiated" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#2a221b"/><stop offset="1" stop-color="#0d0b09"/></radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8976f"/><stop offset="1" stop-color="#9a7a55"/></linearGradient>
  <linearGradient id="pvc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f1ea"/><stop offset="0.55" stop-color="#d9d4c9"/><stop offset="1" stop-color="#b9b3a6"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ede7dc" stroke-opacity="0.045" stroke-width="1"/></pattern>
  <symbol id="hand" viewBox="-20 -22 40 44">
    <g fill="#2f2f31">
      <rect x="-10" y="-1" width="20" height="17" rx="7"/>
      <rect x="-12" y="-16" width="4.6" height="19" rx="2.3"/>
      <rect x="-6" y="-20" width="4.6" height="22" rx="2.3"/>
      <rect x="0" y="-20" width="4.6" height="22" rx="2.3"/>
      <rect x="6" y="-16" width="4.6" height="19" rx="2.3"/>
      <rect x="-17" y="0" width="4.6" height="14" rx="2.3" transform="rotate(-35 -15 3)"/>
    </g>
    <g fill="none" stroke="#2f2f31" stroke-width="2" stroke-linecap="round">
      <path d="M-19 -9V-19H-9M19 -9V-19H9M-19 9V19H-9M19 9V19H9" transform="scale(1.02)"/>
    </g>
  </symbol>
  <symbol id="power" viewBox="-14 -14 28 28"><g fill="none" stroke="#222" stroke-width="3.2" stroke-linecap="round"><path d="M0 -11V-1"/><path d="M-7.5 -7A10.5 10.5 0 1 0 7.5 -7"/></g></symbol>
</defs>
<style>
  text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .s1,.s2,.s3{opacity:0;animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  .s1{opacity:1;animation-name:k1} .s2{animation-name:k2} .s3{animation-name:k3}
  @keyframes k1{0%{opacity:1}35%{opacity:1}38%{opacity:0}96%{opacity:0}100%{opacity:1}}
  @keyframes k2{0%{opacity:0}38%{opacity:0}41%{opacity:1}66%{opacity:1}69%{opacity:0}100%{opacity:0}}
  @keyframes k3{0%{opacity:0}67%{opacity:0}70%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring-load{animation:loadfade 12s infinite}
  @keyframes loadfade{0%{opacity:1}20%{opacity:1}26%{opacity:0}100%{opacity:0}}
  .ring-done{opacity:0;animation:donefade 12s infinite}
  @keyframes donefade{0%{opacity:0}22%{opacity:0}28%{opacity:1}35%{opacity:1}38%{opacity:0}100%{opacity:0}}
  .t-unlocking{animation:loadfade 12s infinite}
  .t-unlocked{opacity:0;animation:donefade 12s infinite}
  .glow{opacity:0;animation:glow 12s infinite}
  @keyframes glow{0%{opacity:0}5%{opacity:.35}12%{opacity:.8}20%{opacity:.55}27%{opacity:1}36%{opacity:1}40%{opacity:0}100%{opacity:0}}
  .press{transform-box:fill-box;transform-origin:center;animation:press 12s infinite}
  @keyframes press{0%,54%{transform:scale(1)}57%{transform:scale(.9)}60%{transform:scale(1)}100%{transform:scale(1)}}
  .ripple{opacity:0;transform-box:fill-box;transform-origin:center;animation:ripple 12s infinite}
  @keyframes ripple{0%,55%{opacity:0;transform:scale(.6)}57%{opacity:.9;transform:scale(.8)}64%{opacity:0;transform:scale(2)}100%{opacity:0}}
  .blink{animation:blink 1.2s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.35}}
  .d1,.d2,.d3{fill:#ede7dc;fill-opacity:.25}
  .d1{animation:dd1 12s infinite}.d2{animation:dd2 12s infinite}.d3{animation:dd3 12s infinite}
  @keyframes dd1{0%{fill:#C6461D;fill-opacity:1}35%{fill:#C6461D;fill-opacity:1}38%{fill:#ede7dc;fill-opacity:.25}100%{fill:#ede7dc;fill-opacity:.25}}
  @keyframes dd2{0%,37%{fill:#ede7dc;fill-opacity:.25}40%,66%{fill:#C6461D;fill-opacity:1}69%,100%{fill:#ede7dc;fill-opacity:.25}}
  @keyframes dd3{0%,68%{fill:#ede7dc;fill-opacity:.25}71%,94%{fill:#C6461D;fill-opacity:1}97%,100%{fill:#ede7dc;fill-opacity:.25}}
  .lab1,.lab2,.lab3{fill:#ede7dc;fill-opacity:.4;font-size:11px;letter-spacing:.18em}
  .lab1{animation:ll1 12s infinite}.lab2{animation:ll2 12s infinite}.lab3{animation:ll3 12s infinite}
  @keyframes ll1{0%,35%{fill-opacity:.95}38%,100%{fill-opacity:.4}}
  @keyframes ll2{0%,37%{fill-opacity:.4}40%,66%{fill-opacity:.95}69%,100%{fill-opacity:.4}}
  @keyframes ll3{0%,68%{fill-opacity:.4}71%,94%{fill-opacity:.95}97%,100%{fill-opacity:.4}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.s1{opacity:1}}
</style>

<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#grid)"/>

<!-- title -->
<text x="40" y="52" fill="#ede7dc" fill-opacity=".9" font-size="15" letter-spacing="5">SCOOTSCOOT</text>
<text x="40" y="72" fill="#C6461D" font-size="10.5" letter-spacing="3.4">SEMI-AUTONOMOUS SCOOTER · DASHBOARD</text>

<!-- handlebar: PVC pipe -->
<rect x="30" y="238" width="740" height="30" rx="15" fill="url(#pvc)"/>
<!-- brake lever -->
<g transform="rotate(-24 150 232)"><rect x="112" y="150" width="20" height="104" rx="9" fill="url(#pvc)" opacity=".95"/></g>
<path d="M148 250q16-10 22 4" fill="none" stroke="#c96f4a" stroke-width="3" stroke-linecap="round"/>
<!-- cardboard grips -->
<g>
  <rect x="38" y="222" width="176" height="62" rx="12" fill="url(#card)"/>
  <rect x="586" y="222" width="176" height="62" rx="12" fill="url(#card)"/>
  <g stroke="#6e5538" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
    <path d="M58 232v42M76 232v42M94 232v42M112 232v42M130 232v42M148 232v42M166 232v42M184 232v42"/>
    <path d="M606 232v42M624 232v42M642 232v42M660 232v42M678 232v42M696 232v42M714 232v42M732 232v42"/>
  </g>
  <rect class="glow" x="120" y="218" width="74" height="70" rx="16" fill="none" stroke="#5fd076" stroke-width="3"/>
  <rect class="glow" x="606" y="218" width="74" height="70" rx="16" fill="none" stroke="#5fd076" stroke-width="3"/>
  <!-- horn nub & mode dial -->
  <circle cx="710" cy="214" r="6" fill="#f4f1ea"/>
  <rect x="560" y="226" width="24" height="54" rx="6" fill="#f0ece3"/><text x="572" y="248" fill="#444" font-size="10" text-anchor="middle">A</text><text x="572" y="270" fill="#444" font-size="10" text-anchor="middle">M</text>
</g>

<!-- dashboard stand + frame -->
<path d="M352 352h96l22 56H330z" fill="#8f7150"/>
<rect x="238" y="132" width="324" height="226" rx="14" fill="url(#card)"/>
<rect x="238" y="132" width="324" height="226" rx="14" fill="none" stroke="#6e5538" stroke-opacity=".5"/>
<circle cx="400" cy="144" r="2.4" fill="#2a2018"/>
<rect x="254" y="154" width="292" height="186" rx="8" fill="#fbfaf7"/>

<!-- ===== scene 1: hands unlock ===== -->
<g class="s1">
  <text x="400" y="183" text-anchor="middle" fill="#bdbdbd" font-size="13" letter-spacing=".5">ScootScoot</text>
  <g transform="translate(340 235)">
    <circle r="31" fill="#d9d9d9"/><use href="#hand" x="-20" y="-22" width="40" height="44"/>
    <g class="ring-load"><circle r="44" fill="none" stroke="#9fd4a7" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 8.9" stroke-opacity=".55"/>
      <circle class="spin" r="44" fill="none" stroke="#3a9a4b" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 17.6"/></g>
    <circle class="ring-done" r="43" fill="none" stroke="#2f9a46" stroke-width="5"/>
  </g>
  <g transform="translate(460 235)">
    <circle r="31" fill="#d9d9d9"/><use href="#hand" x="-20" y="-22" width="40" height="44"/>
    <g class="ring-load"><circle r="44" fill="none" stroke="#9fd4a7" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 8.9" stroke-opacity=".55"/>
      <circle class="spin" r="44" fill="none" stroke="#3a9a4b" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 17.6"/></g>
    <circle class="ring-done" r="43" fill="none" stroke="#2f9a46" stroke-width="5"/>
  </g>
  <text class="t-unlocking" x="400" y="310" text-anchor="middle" fill="#222" font-size="11">Unlocking…</text>
  <text class="t-unlocked" x="400" y="310" text-anchor="middle" fill="#2f9a46" font-size="12" font-weight="600">Unlocked</text>
</g>

<!-- ===== scene 2: fold prompt ===== -->
<g class="s2">
  <text x="400" y="178" text-anchor="middle" fill="#222" font-size="13">Powering off in 27 seconds</text>
  <circle cx="518" cy="176" r="9" fill="none" stroke="#2f9a46" stroke-width="1.6"/>
  <g transform="translate(400 222)"><circle r="25" fill="#d9d9d9"/><use href="#power" x="-14" y="-14" width="28" height="28"/></g>
  <rect x="330" y="258" width="140" height="66" rx="7" fill="#d9d9d9"/>
  <text x="400" y="276" text-anchor="middle" fill="#222" font-size="10.5">Initiate fold mode?</text>
  <g class="press"><rect x="342" y="288" width="56" height="26" rx="8" fill="#bde8c3" stroke="#1d6b2d" stroke-width="2"/>
    <path d="M360 301l6 6 11-12" fill="none" stroke="#1d6b2d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <circle class="ripple" cx="370" cy="301" r="24" fill="none" stroke="#2f9a46" stroke-width="2"/>
  <rect x="402" y="288" width="56" height="26" rx="8" fill="#f1b9b9" stroke="#a83232" stroke-width="2"/>
  <path d="M424 295l12 12M436 295l-12 12" stroke="#a83232" stroke-width="2.4" stroke-linecap="round"/>
</g>

<!-- ===== scene 3: fold initiated ===== -->
<g class="s3">
  <text x="400" y="178" text-anchor="middle" fill="#222" font-size="13">Powering off in 27 seconds</text>
  <circle class="blink" cx="518" cy="176" r="9" fill="none" stroke="#2f9a46" stroke-width="1.6"/>
  <g transform="translate(400 226)"><circle r="25" fill="#d9d9d9"/><use href="#power" x="-14" y="-14" width="28" height="28"/></g>
  <rect x="338" y="270" width="124" height="30" rx="7" fill="#d9d9d9"/>
  <text x="400" y="289" text-anchor="middle" fill="#222" font-size="11">Fold mode initiated</text>
</g>

<!-- progress labels -->
<g text-anchor="middle">
  <circle class="d1" cx="300" cy="448" r="4.5"/><text class="lab1" x="300" y="472">UNLOCK</text>
  <circle class="d2" cx="400" cy="448" r="4.5"/><text class="lab2" x="400" y="472">CONFIRM</text>
  <circle class="d3" cx="500" cy="448" r="4.5"/><text class="lab3" x="500" y="472">FOLD</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
