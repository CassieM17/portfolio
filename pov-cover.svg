<g transform="translate(400 138)"><g class="dial"><circle r="22" fill="#2b3fd0"/><text y="-2" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="700">SWITCH</text><text y="9" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="700">SIDES</text></g></g>
<g class="bubble m1"><rect x="120" y="444" width="190" height="30" rx="15" fill="#ede7dc"/><text x="215.0" y="463.5" text-anchor="middle" fill="#17130f" font-size="12">“Go left!”</text></g>
<g class="bubble m2"><rect x="490" y="444" width="230" height="30" rx="15" fill="#ede7dc"/><text x="605.0" y="463.5" text-anchor="middle" fill="#17130f" font-size="12">“What do you see on your side?”</text></g>
<g class="bubble m3"><rect x="200" y="444" width="400" height="30" rx="15" fill="#ede7dc"/><text x="400.0" y="463.5" text-anchor="middle" fill="#17130f" font-size="12">“If I move here, what do you do?”</text></g>
