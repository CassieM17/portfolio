  <rect x="261" y="267" width="28" height="16" rx="3" fill="#2b3fd0"/><text x="275" y="278.6" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">END</text>
  <circle class="done" cx="275" cy="275" r="19" fill="none" stroke="#2f9a46" stroke-width="4"/>
  <g><circle r="11" fill="#c49a6c" stroke="#7a5a37" stroke-width="2.5"/><circle r="4" fill="#e6c79a"/>
    <animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0000;0.3000;0.3000;0.6000;0.6000;0.8500;0.8500;1.0000;1.0000" keyTimes="0.0000;0.0312;0.2000;0.2938;0.4625;0.5625;0.6875;0.7750;0.8750;1.0000" path="M25 25L75 25L75 75L75 125L25 125L25 175L75 175L125 175L175 175L225 175L275 175L275 225L275 275"/></g>
