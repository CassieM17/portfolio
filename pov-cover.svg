<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Animated Meet Me at My POV maze exhibit: two players see different mazes on opposite sides of the board while linked magnet pieces move together, talking their way from start to end" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="80%"><stop offset="0" stop-color="#2a221b"/><stop offset="1" stop-color="#0d0b09"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ede7dc" stroke-opacity="0.045"/></pattern>
</defs>
<style>
  text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .trail{animation:trl 16.0s linear infinite}
  @keyframes trl{0%{stroke-dashoffset:1}3.12%{stroke-dashoffset:1.000}20.00%{stroke-dashoffset:0.700}29.38%{stroke-dashoffset:0.700}46.25%{stroke-dashoffset:0.400}56.25%{stroke-dashoffset:0.400}68.75%{stroke-dashoffset:0.150}77.50%{stroke-dashoffset:0.150}87.50%{stroke-dashoffset:0.000}96%{stroke-dashoffset:0;opacity:1}99%{opacity:0}100%{stroke-dashoffset:1;opacity:0}}
  .done{opacity:0;animation:done 16.0s infinite}
  @keyframes done{0%,86.88%{opacity:0;transform:scale(.6)}89.38%{opacity:1;transform:scale(1)}96%{opacity:1}99%,100%{opacity:0}}
  .done{transform-box:fill-box;transform-origin:center}
  .bubble{opacity:0;animation-duration:16.0s;animation-iteration-count:infinite;transform-box:fill-box;transform-origin:center}
  .m1{animation-name:m1}.m2{animation-name:m2}.m3{animation-name:m3}.m4{animation-name:m4}
  @keyframes m1{0%,16.25%{opacity:0}18.75%{opacity:1}28.75%{opacity:1}31.25%,100%{opacity:0}}
  @keyframes m2{0%,42.50%{opacity:0}45.00%{opacity:1}55.00%{opacity:1}57.50%,100%{opacity:0}}
  @keyframes m3{0%,65.00%{opacity:0}67.50%{opacity:1}76.25%{opacity:1}78.75%,100%{opacity:0}}
  @keyframes m4{0%,87.50%{opacity:0}90.00%{opacity:1}95%{opacity:1}98%,100%{opacity:0}}
  .dial{transform-box:fill-box;transform-origin:center;animation:dial 16.0s ease-in-out infinite}
  @keyframes dial{0%,46.25%{transform:rotate(0)}56.25%{transform:rotate(180deg)}100%{transform:rotate(180deg)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
  .pulse.p2{animation-delay:.8s}
  @keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.7);opacity:0}}
  .stage{animation:stage 16.0s infinite}
  @keyframes stage{0%{opacity:0}3.12%{opacity:1}95%{opacity:1}98%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.trail{stroke-dashoffset:0}}
</style>
<rect width="800" height="500" fill="url(#bg)"/><rect width="800" height="500" fill="url(#grid)"/>
